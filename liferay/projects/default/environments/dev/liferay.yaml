liferay-default:
    image:
        tag: 2025.q1.20-lts
    livenessProbe:
        failureThreshold: 3
        httpGet:
            path: /c/portal/robots
            port: 8080
        initialDelaySeconds: 60
        periodSeconds: 30
        timeoutSeconds: 5
    readinessProbe:
        failureThreshold: 2
        httpGet:
            path: /c/portal/robots
            port: 8080
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 5
    startupProbe:
        failureThreshold: 90
        httpGet:
            path: /c/portal/robots
            port: 8080
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
network:
    enabled: true
    endpointRef: https
