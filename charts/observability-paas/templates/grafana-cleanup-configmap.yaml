{{- if .Values.jobs.deleteUnprovisionedResources.enabled }}
{{- $datasourceUid := index .Values "observability" "datasource" "uid" | default "managed-prometheus" -}}
{{- $script := include "observability-paas.scripts.grafana-cleanup" . | replace "gcp-prometheus" $datasourceUid -}}
apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        {{- include "observability-paas.labels" . | nindent 8 }}
    name: {{ printf "%s-script" (include "observability-paas.cleanup.fullname" .) | quote }}
    namespace: {{ include "observability-paas.namespace" . | quote }}
data:
    grafana-cleanup.sh: |
        {{- $script | nindent 8 }}
{{- end }}
