{{- if eq .Values.logs.backend "cloud-logging" -}}
apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        {{- include "observability.labels" . | nindent 8 }}
        grafana_datasource: "true"
    name: {{ printf "%s-cloud-logging-datasource" (include "observability.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
    namespace: {{ include "observability.namespace" . | quote }}
data:
    cloud-logging-datasource.yaml: |
        apiVersion: 1
        datasources:
            -   access: proxy
                editable: true
                jsonData:
                    authenticationType: gce
                    logBucketFilter: {{ .Values.logs.cloudLogging.logBucketFilter | quote }}
                name: Google Cloud Logging
                type: googlecloud-logging-datasource
                uid: liferay-cloud-logging
{{- end -}}
