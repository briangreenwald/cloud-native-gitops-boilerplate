cloudProvider: ""

customLabels: {}

fullnameOverride: ""
nameOverride: ""
namespaceOverride: observability

aws:
    region: ""
    ampWorkspaceUrl: ""

gcp:
    projectId: ""

centralHub:
    gitUrl: ""
    argocdUrl: ""
    argoWorkflowsUrl: ""

datasource:
    name: Prometheus
    uid: managed-prometheus
    type: prometheus

logs:
    backend: ""
    cloudLogging:
        logBucketFilter: ".*workspace"
    cloudwatch:
        region: ""
        authType: default
        assumeRoleArn: ""

search:
    elasticsearch:
        enabled: false
    opensearch:
        enabled: false

alloy:
    enabled: true
    namespace: observability
    scrapeInterval: 1m
    iam:
        awsRoleArn: ""
        gcpServiceAccount: ""
    scrape:
        kubeStateMetrics:
            enabled: true
            port: http
            path: /metrics
        cadvisor:
            enabled: true
            path: /metrics/cadvisor
        nodeExporter:
            enabled: true
            port: metrics
            path: /metrics
        pushgateway:
            enabled: true
            port: http
            path: /metrics
        liferay:
            enabled: true
            matchLabels:
                component: liferay
            port: 12345
            path: /metrics
        envoy:
            enabled: true
            port: 19001
            path: /stats/prometheus
        rdsExporter:
            enabled: false
            port: http
            path: /metrics
        cloudwatchRds:
            enabled: false
            region: ""
            scrapeInterval: 1m
            discoveryInterval: 5m
            nameTagRegex: ".*-database-(blue|green)$"
            metrics:
                -   name: CPUUtilization
                    statistics: [Average, Maximum]
                -   name: FreeableMemory
                    statistics: [Average, Minimum]
                -   name: FreeStorageSpace
                    statistics: [Average, Minimum]
                -   name: ReadIOPS
                    statistics: [Average]
                -   name: WriteIOPS
                    statistics: [Average]
                -   name: ReadLatency
                    statistics: [Average, Maximum]
                -   name: WriteLatency
                    statistics: [Average, Maximum]
                -   name: SwapUsage
                    statistics: [Average, Maximum]
                -   name: DiskQueueDepth
                    statistics: [Average, Maximum]
                -   name: ReplicaLag
                    statistics: [Average, Maximum]
    remoteWrite:
        url: ""
        basicAuth:
            username: ""
            password: ""
        bearerToken: ""
        headers: {}
        externalLabels: {}

rdsExporter:
    enabled: false
    image:
        repository: public.ecr.aws/qonto/prometheus-rds-exporter
        tag: "0.13.0"
    iam:
        awsRoleArn: ""
    region: ""
    resources:
        limits:
            cpu: 100m
            memory: 128Mi
        requests:
            cpu: 25m
            memory: 64Mi

grafana-alloy:
    namespaceOverride: observability
    alloy:
        clustering:
            enabled: true
        configMap:
            create: false
            key: config.alloy
            name: liferay-alloy-config
        securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    -   ALL
            privileged: false
            readOnlyRootFilesystem: false
    configReloader:
        securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    -   ALL
            privileged: false
            readOnlyRootFilesystem: false
    controller:
        type: daemonset
    global:
        podSecurityContext:
            fsGroup: 473
            runAsGroup: 473
            runAsNonRoot: true
            runAsUser: 473
            seccompProfile:
                type: RuntimeDefault
    serviceAccount:
        create: false
        name: liferay-alloy

alerting:
    folder: alerts
    interval: 1m
    rules:
        cpu-limit-utilization:
            title: "Container CPU Limit Utilization Above 80%"
            expr: |
                avg_over_time(liferay:container_cpu_limit_utilization:ratio{namespace=~"liferay-.*-.*"}[2m]) > 0.8
            interval: 2m
            labels:
                aggregation_period: 2m
                type: warning
                unit: percent
        memory-limit-utilization:
            title: "Container Memory Limit Utilization Above 80%"
            expr: |
                avg_over_time(liferay:container_memory_limit_utilization:ratio{namespace=~"liferay-.*-.*"}[2m]) > 0.8
            interval: 2m
            labels:
                aggregation_period: 2m
                type: warning
                unit: percent
        frequent-pod-restarts:
            title: "High Rate of Pod Restarts Detected"
            expr: |
                sum by (container, namespace, pod) (
                    increase(kube_pod_container_status_restarts_total[30m])
                ) > 3
                and on(namespace)
                label_replace(
                    kube_namespace_labels{label_liferay_com_observable="true"},
                    "namespace", "$1", "exported_namespace", "(.*)"
                )
            labels:
                aggregation_period: 30m
                type: warning
                unit: occurrences
        zero-ready-replicas:
            title: "Deployment or StatefulSet with Zero Ready Replicas"
            expr: |
                (
                    max_over_time(kube_deployment_status_replicas_ready[10m]) == 0
                    or
                    max_over_time(kube_statefulset_status_replicas_ready[10m]) == 0
                )
            labels:
                aggregation_period: 10m
                type: critical
                unit: state
    recordingRules:
        container-cpu-limit-utilization-ratio:
            record: liferay:container_cpu_limit_utilization:ratio
            expr: |
                sum by (container, namespace, pod) (
                    rate(container_cpu_usage_seconds_total{container!="", container!="POD"}[5m])
                )
                /
                sum by (container, namespace, pod) (
                    kube_pod_container_resource_limits{resource="cpu"}
                )
        container-memory-limit-utilization-ratio:
            record: liferay:container_memory_limit_utilization:ratio
            expr: |
                sum by (container, namespace, pod) (
                    container_memory_working_set_bytes{container!="", container!="POD"}
                )
                /
                sum by (container, namespace, pod) (
                    kube_pod_container_resource_limits{resource="memory"}
                )
        rds-meta-aws:
            cloudProvider: aws
            record: liferay:_rds_meta
            expr: |
                group by (dbinstance_identifier, tag_EnvironmentId, tag_ProjectId, instance_class) (
                    (label_replace(aws_rds_info, "dbinstance_identifier", "$1", "tag_Name", "(.+)") + 1)
                    * on(dbinstance_identifier) group_left(instance_class)
                    rds_instance_info{job="prometheus-rds-exporter"}
                )
        rds-memory-bytes-aws:
            cloudProvider: aws
            record: liferay:_rds_memory_bytes
            expr: |
                rds_instance_memory_bytes{job="prometheus-rds-exporter"}
                * on(instance_class) group_right
                liferay:_rds_meta
        rds-vcpu-avg-aws:
            cloudProvider: aws
            record: liferay:_rds_vcpu
            expr: |
                rds_instance_vcpu_average{job="prometheus-rds-exporter"}
                * on(instance_class) group_right
                liferay:_rds_meta
        db-instance-state-aws:
            cloudProvider: aws
            record: liferay:db_instance_state
            expr: |
                sum by (environment_id, project_id, database_id, data_plane, state) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            label_replace(rds_instance_status{job="prometheus-rds-exporter"} == 1, "state", "RUNNING", "dbinstance_identifier", ".*")
                            * on(dbinstance_identifier) group_left(tag_EnvironmentId, tag_ProjectId) liferay:_rds_meta,
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-instance-state-gcp:
            cloudProvider: gcp
            record: liferay:db_instance_state
            expr: |
                sum by (environment_id, database_id, state) (
                    label_replace(
                      label_replace(
                        last_over_time(cloudsql_googleapis_com:database_instance_state[5m]) > 0,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-cpu-utilization-percent-aws:
            cloudProvider: aws
            record: liferay:db_cpu_utilization_percent
            expr: |
                sum by (environment_id, project_id, database_id, data_plane, engine) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            label_replace(
                              aws_rds_cpuutilization_average{job="cloudwatch-rds"}
                              * on(dbinstance_identifier) group_left(tag_EnvironmentId, tag_ProjectId) liferay:_rds_meta,
                              "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                            "project_id", "$1", "tag_ProjectId", "(.+)"),
                          "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                        "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$"),
                      "engine", "$1", "dimension_EngineName", "(.+)")
                )
        db-cpu-utilization-percent-gcp:
            cloudProvider: gcp
            record: liferay:db_cpu_utilization_percent
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        rate(cloudsql_googleapis_com:database_cpu_usage_time[5m])
                        /
                        on(metadata_user_environment_id, metadata_system_name, db_name)
                        cloudsql_googleapis_com:database_cpu_reserved_cores
                        * 100,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-cpu-reserved-cores-aws:
            cloudProvider: aws
            record: liferay:db_cpu_reserved_cores
            expr: |
                sum by (environment_id, project_id, database_id, data_plane) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            liferay:_rds_vcpu,
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-cpu-reserved-cores-gcp:
            cloudProvider: gcp
            record: liferay:db_cpu_reserved_cores
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        cloudsql_googleapis_com:database_cpu_reserved_cores,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-cpu-used-cores-aws:
            cloudProvider: aws
            record: liferay:db_cpu_used_cores
            expr: |
                sum by (environment_id, project_id, database_id, data_plane) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            liferay:_rds_vcpu
                            * on(dbinstance_identifier) group_left()
                            (rds_cpu_usage_percent_average{job="prometheus-rds-exporter"} / 100),
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-cpu-used-cores-gcp:
            cloudProvider: gcp
            record: liferay:db_cpu_used_cores
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        rate(cloudsql_googleapis_com:database_cpu_usage_time[5m]),
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-memory-used-bytes-aws:
            cloudProvider: aws
            record: liferay:db_memory_used_bytes
            expr: |
                sum by (environment_id, project_id, database_id, data_plane) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            liferay:_rds_memory_bytes
                            - on(dbinstance_identifier)
                            rds_freeable_memory_bytes{job="prometheus-rds-exporter"},
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-memory-used-bytes-gcp:
            cloudProvider: gcp
            record: liferay:db_memory_used_bytes
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        cloudsql_googleapis_com:database_memory_usage,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-memory-total-bytes-aws:
            cloudProvider: aws
            record: liferay:db_memory_total_bytes
            expr: |
                sum by (environment_id, project_id, database_id, data_plane) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            liferay:_rds_memory_bytes,
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-memory-total-bytes-gcp:
            cloudProvider: gcp
            record: liferay:db_memory_total_bytes
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        cloudsql_googleapis_com:database_memory_quota,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-disk-used-bytes-aws:
            cloudProvider: aws
            record: liferay:db_disk_used_bytes
            expr: |
                sum by (environment_id, project_id, database_id, data_plane) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            (rds_allocated_storage_bytes{job="prometheus-rds-exporter"}
                             - on(dbinstance_identifier) rds_free_storage_bytes{job="prometheus-rds-exporter"})
                            * on(dbinstance_identifier) group_left(tag_EnvironmentId, tag_ProjectId) liferay:_rds_meta,
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-disk-used-bytes-gcp:
            cloudProvider: gcp
            record: liferay:db_disk_used_bytes
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        cloudsql_googleapis_com:database_disk_bytes_used,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
        db-disk-total-bytes-aws:
            cloudProvider: aws
            record: liferay:db_disk_total_bytes
            expr: |
                sum by (environment_id, project_id, database_id, data_plane, engine) (
                    label_replace(
                      label_replace(
                        label_replace(
                          label_replace(
                            rds_allocated_storage_bytes{job="prometheus-rds-exporter"}
                            * on(dbinstance_identifier) group_left(tag_EnvironmentId, tag_ProjectId) liferay:_rds_meta,
                            "environment_id", "$1", "tag_EnvironmentId", "(.+)"),
                          "project_id", "$1", "tag_ProjectId", "(.+)"),
                        "data_plane", "$1", "dbinstance_identifier", ".*-database-(blue|green)$"),
                      "database_id", "$1", "dbinstance_identifier", "(.+?)-database-(?:blue|green)$")
                )
        db-disk-total-bytes-gcp:
            cloudProvider: gcp
            record: liferay:db_disk_total_bytes
            expr: |
                sum by (environment_id, database_id) (
                    label_replace(
                      label_replace(
                        cloudsql_googleapis_com:database_disk_quota,
                        "environment_id", "$1", "metadata_user_environment_id", "(.+)"),
                      "database_id", "$1", "metadata_system_name", ".*-db-(.*)")
                )
    defaultChannel: ""
    notificationChannels: {}
    templates: {}

dashboards:
    folder: Liferay
    items:
        backups:
            file: dashboards/backups.json
        central-hub:
            file: dashboards/central-hub.json
        custom-domains:
            file: dashboards/custom-domains.json
        databases:
            file: dashboards/databases.json
        kubernetes-workloads:
            file: dashboards/kubernetes-workloads.json
        load-balancers:
            file: dashboards/load-balancers.json

grafana:
    enabled: true
    namespaceOverride: observability
    podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    rbac:
        namespaced: true
    resources:
        limits:
            cpu: 500m
            memory: 512Mi
        requests:
            cpu: 100m
            memory: 256Mi
    serviceMonitor:
        enabled: false
    serviceAccount:
        annotations:
            eks.amazonaws.com/role-arn: ""
        automountServiceAccountToken: true
        name: grafana
    datasources: {}
    sidecar:
        logLevel: error
        alerts:
            enabled: true
            env:
                HEALTH_PORT: 8081
            labelValue: "true"
            searchNamespace: ""
            watchMethod: SLEEP
            resource: configmap
        dashboards:
            enabled: true
            env:
                HEALTH_PORT: 8084
            labelValue: "true"
            searchNamespace: ""
            watchMethod: SLEEP
            resource: configmap
            folderAnnotation: grafana_folder
            provider:
                foldersFromFilesStructure: true
        datasources:
            enabled: true
            env:
                HEALTH_PORT: 8082
            defaultDatasourceEnabled: true
            labelValue: "true"
            searchNamespace: ""
            watchMethod: SLEEP
            resource: configmap
            alertmanager:
                enabled: false
            timeout: 180s
        plugins:
            enabled: true
    grafana.ini:
        analytics:
            check_for_plugin_updates: true
            check_for_updates: true
            reporting_enabled: false
        auth:
            sigv4_auth_enabled: true
        annotations:
            cleanupjob_batchsize: 300
        annotations.api:
            max_age: 10d
            max_annotations_to_keep: 3000
        annotations.dashboard:
            max_age: 10d
            max_annotations_to_keep: 3000
        dashboards:
            default_home_dashboard_path: /tmp/dashboards/Liferay/central-hub.json
        feature_toggles:
            enable: accessControlOnCall,idForwarding,externalServiceAccounts
        log:
            mode: console
            level: error
            filters: plugins:error
        log.console:
            format: json
        plugins:
            disable_plugins: grafana-lokiexplore-app
        server:
            enable_gzip: true
            read_timeout: 0
        unified_alerting.state_history.annotations:
            max_age: 10d
            max_annotations_to_keep: 3000
        users:
            default_theme: light
    podDisruptionBudget:
        maxUnavailable: 1
    networkPolicy:
        enabled: false

kube-state-metrics:
    enabled: true
    namespaceOverride: observability
    networkPolicy:
        enabled: true
        egress:
            -   {}
        ingress:
            -   from:
                    -   podSelector: {}
    podDisruptionBudget:
        maxUnavailable: 1
    resources:
        limits:
            cpu: 100m
            memory: 256Mi
        requests:
            cpu: 30m
            memory: 128Mi
    prometheusScrape: false
    prometheus:
        monitor:
            enabled: false
    metricLabelsAllowlist:
        -   "namespaces=[liferay.com/observable]"
    extraArgs:
        -   --v=1
        -   --metric-allowlist=kube_deployment_status_replicas_ready,kube_statefulset_status_replicas_ready,kube_pod_container_status_restarts_total,kube_pod_container_resource_limits,kube_pod_container_resource_requests,kube_pod_container_info,kube_namespace_labels,kube_node_info,kube_node_status_condition
    serviceAccount:
        automountServiceAccountToken: false

prometheus-node-exporter:
    enabled: true
    namespaceOverride: observability
    rbac:
        create: true
    serviceAccount:
        create: true
        automountServiceAccountToken: false
    prometheus:
        monitor:
            enabled: false
        podMonitor:
            enabled: false
    securityContext:
        fsGroup: 0
    service:
        enabled: true
    networkPolicy:
        enabled: true
        ingress:
            -   from:
                    -   podSelector: {}
    resources:
        limits:
            cpu: 102m
            memory: 180Mi
        requests:
            cpu: 102m
            memory: 180Mi
    extraArgs:
        -   --log.level=error
        -   --log.format=json

prometheus-pushgateway:
    enabled: true
    namespaceOverride: observability
    resources:
        limits:
            cpu: 100m
            memory: 50Mi
        requests:
            cpu: 100m
            memory: 30Mi
    securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
            type: RuntimeDefault
    containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
            drop:
                -   ALL
        privileged: false
        readOnlyRootFilesystem: false
    extraArgs:
        -   --persistence.file=/data/pushgateway.data
        -   --persistence.interval=1m
        -   --log.format=json
        -   --log.level=error
    extraContainers:
        -   name: pushgateway-cleaner
            args:
                -   --sync-period=1m
                -   --ttl=1m
            image: ghcr.io/abatilo/pushgateway-cleaner:v0.1.3
            resources:
                limits:
                    cpu: 40m
                    memory: 16Mi
                requests:
                    cpu: 20m
                    memory: 4Mi
            securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                    drop:
                        -   ALL
                privileged: false
                readOnlyRootFilesystem: false
    automountServiceAccountToken: false
    networkPolicy:
        allowAll: true
